<div class="chart-grid">
  <figure>
    <figcaption>Median response time by service</figcaption>
    <div class="chart-frame">
      <canvas class="median-chart" aria-label="Median response time by service bar chart"></canvas>
      @if (loading()) {
        <app-chart-loading-placeholder label="Loading median response time chart" />
      }
    </div>
  </figure>
  <figure>
    <figcaption>Successful attempt timing by round</figcaption>
    <div class="chart-frame">
      <canvas
        class="attempts-chart"
        aria-label="Successful attempt timing by round line chart"
      ></canvas>
      @if (loading()) {
        <app-chart-loading-placeholder label="Loading successful attempt timing chart" />
      }
    </div>
  </figure>
</div>
